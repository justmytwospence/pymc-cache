project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - getting-started.qmd
    - guides/*.qmd
    - reference.qmd
    - api/*.qmd
    - contributing.qmd
    - releasing.qmd
website:
  title: pymc-cache
  site-url: https://justmytwospence.github.io/pymc-cache/
  repo-url: https://github.com/justmytwospence/pymc-cache
  navbar:
    left:
      - href: getting-started.qmd
        text: Get started
      - href: guides/identity.qmd
        text: Identity and safety
      - href: guides/storage.qmd
        text: Storage
      - href: reference.qmd
        text: API
quartodoc:
  package: pymc_cache
  dir: api
  sections:
    - title: Public API
      contents:
        - sample
        - sample_smc
        - CacheBackend
        - MemoryCache
        - DiskCache
        - CacheSession
        - CachePolicy
        - CacheEntry
        - CacheLookup
        - UncacheableError
        - CacheWarning
        - cleanup_cache
        - model_digest
        - cache_key
format:
  html:
    theme: cosmo
    toc: true
execute:
  enabled: false
