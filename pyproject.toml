[project]
name = "pymc-cache"
dynamic = ["version"]
description = "Safe, model-aware caching of PyMC sampling results"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Spencer Boucher" }]
keywords = ["pymc", "mcmc", "cache", "bayesian", "inferencedata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pymc>=5.28,<7", "arviz>=0.17,<2", "numpy>=1.25",
    "pytensor>=2.38", "xarray>=2023.1", "h5netcdf>=1.3", "h5py>=3.10",
]

[project.scripts]
pymc-cache = "pymc_cache.cli:main"

[project.urls]
Homepage = "https://github.com/justmytwospence/pymc-cache"
Documentation = "https://justmytwospence.github.io/pymc-cache/"
Repository = "https://github.com/justmytwospence/pymc-cache"
Issues = "https://github.com/justmytwospence/pymc-cache/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pymc_cache/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pymc_cache"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "examples", "guides", "api", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "AGENTS.md", "pyproject.toml", "_quarto.yml", "index.qmd", "getting-started.qmd", "contributing.qmd", "releasing.qmd", "reference.qmd", "custom.scss"]
exclude = [".extraction-source", "uv.lock", ".git", ".pi", "_site", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: browser integration tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pymc_cache"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "twine>=5"]
docs = ["quartodoc>=0.11,<0.12", "griffe<2"]
