name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.11', pymc: 'pymc==5.28.5', arviz: 'arviz>=0.17,<1'}
          - {python: '3.12', pymc: 'pymc>=5.28,<6', arviz: 'arviz>=0.17,<1'}
          - {python: '3.13', pymc: 'pymc>=5.28,<6', arviz: 'arviz>=0.17,<1'}
          - {python: '3.12', pymc: 'pymc>=6,<7', arviz: 'arviz>=1,<2'}
          - {python: '3.13', pymc: 'pymc>=6,<7', arviz: 'arviz>=1,<2'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv python install '${{ matrix.python }}'
      - run: uv venv --python '${{ matrix.python }}'
      - run: uv pip install --python .venv/bin/python -e . --group dev '${{ matrix.pymc }}' '${{ matrix.arviz }}' 'numpy<2.4'
      - run: .venv/bin/pytest -q --cov=pymc_cache --cov-fail-under=85
      - run: .venv/bin/ruff check src tests scripts examples
      - run: .venv/bin/python scripts/check_examples.py
  docs-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
      - run: uv python install 3.13
      - run: uv lock --check --no-config
      - run: uv run --frozen python -c 'import pymc_cache, quartodoc'
      - run: bash scripts/build-docs.sh
      - run: uv build --no-sources
      - run: uv run --frozen twine check dist/*
      - run: uv run --frozen python scripts/check_artifact.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: dist/
      - name: Upload Pages artifact on main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy-pages:
    needs: docs-artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
